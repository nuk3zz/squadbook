name: Deploy Squadbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add shared connection config
        env:
          SQUADBOOK_SUPABASE_URL: ${{ secrets.SQUADBOOK_SUPABASE_URL }}
          SQUADBOOK_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SQUADBOOK_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SQUADBOOK_SUPABASE_URL"
          test -n "$SQUADBOOK_SUPABASE_PUBLISHABLE_KEY"
          jq -n \
            --arg url "$SQUADBOOK_SUPABASE_URL" \
            --arg publishableKey "$SQUADBOOK_SUPABASE_PUBLISHABLE_KEY" \
            '{url: $url, publishableKey: $publishableKey}' \
            > dist/data/supabase-config.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
